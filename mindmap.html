<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio-map | 마인드맵</title>
    <style>
        @font-face {
            font-family: 'Pretendard';
            src: url('/fonts/PretendardVariable.woff2') format('woff2');
            font-weight: 45 920;
            font-style: normal;
            font-display: swap;
        }
        :root { --navy: #1A365D; --blue: #3182CE; --ink: #1A365D; --muted: #718096; --page: #F4F6F9; --card: #ffffff; --subcard: #F4F6F9; --node-border: #3182CE; --line: #83b7e5; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); background: var(--page); }
        header { min-height: 70px; padding: 15px clamp(20px, 5vw, 70px); display: flex; justify-content: space-between; align-items: center; background: var(--card); box-shadow: 0 2px 12px #19375f12; }
        .brand { font-size: 1.1rem; font-weight: 800; color: var(--blue); text-decoration: none; }
        .edit { border: 0; border-radius: 8px; padding: 10px 16px; background: var(--blue); color: white; font-weight: 700; cursor: pointer; }
        .edit:hover { background: #1765bd; }
        .theme-switch { border: 1px solid #b9d2ee; border-radius: 8px; padding: 9px 12px; color: var(--navy); background: transparent; font-weight: 700; cursor: pointer; }
        main { max-width: 1250px; margin: 0 auto; padding: 32px 20px 60px; }
        .heading { text-align: center; margin-bottom: 26px; }
        h1 { font-size: clamp(1.55rem, 3vw, 2.35rem); margin: 0 0 8px; color: var(--navy); }
        .heading p { margin: 0; color: var(--muted); }
        .mindmap { position: relative; min-height: 590px; padding: 30px; display: grid; grid-template-columns: 1fr 1.25fr 1fr; grid-template-rows: 1fr 1fr; gap: 28px 90px; align-items: center; overflow: hidden; }
        .connections { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
        .connections line { stroke: var(--line); stroke-width: .45; vector-effect: non-scaling-stroke; }
        .node { position: relative; z-index: 1; border: 1px solid var(--node-border); border-radius: 18px; padding: 22px; background: var(--card); box-shadow: 0 10px 25px #1c41601a; }
        .center { grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: center; width: min(100%, 340px); padding: 34px 24px; text-align: center; color: var(--ink); }
        .center .label { font-size: .8rem; letter-spacing: .08em; color: var(--blue); font-weight: 800; }
        .center h2 { margin: 8px 0; font-size: 1.8rem; }
        .center p { margin: 0; font-weight: 600; }
        .skills { grid-column: 1; grid-row: 1; }
        .projects { grid-column: 3; grid-row: 2; }
        .intro { grid-column: 1; grid-row: 2; }
        .summary { grid-column: 3; grid-row: 1; }
        .node h3 { margin: 0 0 13px; font-size: 1rem; color: var(--navy); }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { border: 1px solid var(--node-border); border-radius: 20px; padding: 6px 10px; background: var(--subcard); font-size: .88rem; font-weight: 650; }
        .node p { white-space: pre-wrap; margin: 0; line-height: 1.65; font-size: .94rem; }
        .project-item { padding: 12px; margin-top: 9px; background: var(--subcard); border: 1px solid var(--node-border); border-radius: 10px; }
        .project-item h4 { margin: 0 0 6px; color: var(--blue); font-size: .95rem; }
        .empty { grid-column: 1 / -1; align-self: center; text-align: center; padding: 70px 25px; background: var(--card); border: 1px solid var(--node-border); border-radius: 20px; color: var(--muted); box-shadow: 0 10px 25px #1c416010; }
        .hidden { display: none; }
        body.dark { --navy: #E0E0E0; --blue: #03DAC6; --ink: #E0E0E0; --muted: #b7b7b7; --page: #121212; --card: #1D1D1D; --subcard: #242424; --node-border: #BB86FC; --line: #03DAC6; }
        body.dark header { box-shadow: 0 2px 12px #00000055; } body.dark .theme-switch { color: #03DAC6; border-color: #03DAC6; } body.dark .edit { background: #BB86FC; color: #121212; } body.dark .node { box-shadow: 0 10px 25px #00000044; } body.dark .center { box-shadow: 0 10px 25px #00000044; }
        @media (max-width: 750px) { .mindmap { display: flex; flex-direction: column; min-height: 0; padding: 10px 0; gap: 16px; } .connections { display: none; } .node { width: 100%; } .center { order: -1; } }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/">포트폴리오 맵</a>
        <button id="theme-switch" class="theme-switch" type="button" onclick="toggleTheme()"></button>
        <button class="edit" type="button" onclick="location.href='/editor'">마이페이지</button>
    </header>
    <main>
        <div class="heading">
            <h1>나의 포트폴리오 마인드맵</h1>
            <p>중심에서 연결되는 나의 강점과 경험을 한눈에 확인하세요.</p>
        </div>
        <section id="mindmap" class="mindmap hidden">
            <svg class="connections" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <line x1="42" y1="43" x2="31" y2="29"></line>
                <line x1="42" y1="57" x2="31" y2="71"></line>
                <line x1="58" y1="43" x2="69" y2="29"></line>
                <line x1="58" y1="57" x2="69" y2="71"></line>
            </svg>
            <article class="node skills"><h3>✦ 보유 기술</h3><div id="skills" class="tags"></div></article>
            <article class="node intro"><h3>✦ 지원 방향</h3><p id="intro"></p></article>
            <article class="node center"><div class="label">PORTFOLIO</div><h2 id="name"></h2><p id="position"></p></article>
            <article class="node summary"><h3>✦ 핵심 요약</h3><p id="summary"></p></article>
            <article class="node projects"><h3>✦ 프로젝트 · 경력</h3><div id="projects"></div></article>
        </section>
        <section id="empty" class="empty hidden">
            <h2>아직 저장된 포트폴리오가 없습니다.</h2>
            <p>편집 화면에서 내용을 작성하고 저장한 뒤 마인드맵을 열어주세요.</p>
            <button class="edit" type="button" onclick="location.href='/editor'">포트폴리오 작성하기</button>
        </section>
    </main>
    <script>
        const API_URL = 'http://127.0.0.1:8000';
        const token = localStorage.getItem('access_token');

        function applyTheme() {
            const isDark = localStorage.getItem('portfolio-theme') === 'dark';
            document.body.classList.toggle('dark', isDark);
            document.getElementById('theme-switch').textContent = isDark ? '☀ 화이트' : '◐ 다크';
        }
        function toggleTheme() {
            localStorage.setItem('portfolio-theme', document.body.classList.contains('dark') ? 'light' : 'dark');
            applyTheme();
        }
        applyTheme();

        function showEmpty() { document.getElementById('empty').classList.remove('hidden'); }

        async function loadMindMap() {
            if (!token) { location.href = '/editor'; return; }
            try {
                const response = await fetch(`${API_URL}/api/portfolio/latest`, { headers: { Authorization: `Bearer ${token}` } });
                if (response.status === 404) { showEmpty(); return; }
                if (response.status === 401) { localStorage.removeItem('access_token'); location.href = '/editor'; return; }
                if (!response.ok) throw new Error('portfolio request failed');
                const portfolio = await response.json();
                document.getElementById('name').textContent = portfolio.name || '이름 미입력';
                document.getElementById('position').textContent = portfolio.position || '지원 포지션 미입력';
                document.getElementById('intro').textContent = `${portfolio.position || '희망 분야'}에서 성장하고 싶은 지원자입니다.`;
                document.getElementById('summary').textContent = `${portfolio.name || '나'}의 기술과 프로젝트 경험을 연결한 포트폴리오입니다.`;
                const projects = document.getElementById('projects');
                const projectList = portfolio.projects || (portfolio.details ? [{ title: '경력 및 프로젝트', description: portfolio.details }] : []);
                if (projectList.length) {
                    projectList.forEach(project => {
                        const item = document.createElement('article');
                        item.className = 'project-item';
                        const title = document.createElement('h4');
                        title.textContent = project.title || '제목 없는 프로젝트';
                        const description = document.createElement('p');
                        description.textContent = project.description || '내용이 입력되지 않았습니다.';
                        item.append(title, description);
                        projects.appendChild(item);
                    });
                } else {
                    projects.innerHTML = '<div class="project-item"><h4>프로젝트 미입력</h4><p>편집 화면에서 프로젝트를 추가해보세요.</p></div>';
                }
                const skills = document.getElementById('skills');
                (portfolio.tech_stack || []).filter(Boolean).forEach(skill => { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = skill; skills.appendChild(tag); });
                if (!skills.children.length) skills.innerHTML = '<span class="tag">기술 미입력</span>';
                document.getElementById('mindmap').classList.remove('hidden');
            } catch (error) { showEmpty(); }
        }
        loadMindMap();
    </script>
</body>
</html>
