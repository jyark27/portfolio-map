<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio-map | 개발자 소개</title>
    <style>
        /* Pretendard 폰트와 마인드맵 노드에 공통으로 적용되는 테마 변수 */
        /* 제공된 Pretendard 웹폰트를 화면 전체에 적용합니다. */
        @font-face {
            font-family: 'Pretendard';
            src: url('/fonts/PretendardVariable.woff2') format('woff2');
            font-weight: 45 920;
            font-style: normal;
            font-display: swap;
        }
        /* 모든 마인드맵 노드가 공유하는 카드·보더·연결선 색상 변수입니다. */
        :root { --navy: #1A365D; --blue: #3182CE; --ink: #1A365D; --muted: #718096; --page: #F4F6F9; --card: #ffffff; --subcard: #F4F6F9; --node-border: #3182CE; --line: #83B7E5; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); background: var(--page); }
        header { min-height: 70px; padding: 15px clamp(20px, 5vw, 70px); display: flex; justify-content: space-between; align-items: center; background: var(--card); box-shadow: 0 2px 12px #19375f12; }
        .brand { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; font-weight: 800; color: var(--blue); text-decoration: none; }
        .home-btn { border: 1px solid #b9d2ee; border-radius: 8px; padding: 9px 16px; background: transparent; color: var(--navy); font-weight: 700; cursor: pointer; }
        .home-btn:hover { background: #eaf3fd; }
        main { max-width: 1250px; margin: 0 auto; padding: 32px 20px 60px; }
        .heading { text-align: center; margin-bottom: 26px; }
        .eyebrow { display: inline-block; padding: 6px 12px; border-radius: 20px; background: #e7f2ff; color: #1766bc; font-size: .8rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 12px; }
        h1 { font-size: clamp(1.55rem, 3vw, 2.35rem); margin: 0 0 8px; color: var(--navy); }
        .heading p { margin: 0; color: var(--muted); }
        /* 위쪽 정보·중앙 포트폴리오·아래쪽 프로젝트 가지를 배치하는 마인드맵 */
        .mindmap { position: relative; min-height: 680px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 38px; overflow: hidden; }
        /* 중앙 노드와 각 정보·프로젝트 카드를 연결하는 SVG 선 */
        .connections { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
        .connections line { stroke: var(--line); stroke-width: .45; vector-effect: non-scaling-stroke; }
        /* 기술·역할·강점·프로젝트가 같은 디자인을 쓰는 공통 카드 */
        .node { position: relative; z-index: 1; border: 1px solid var(--node-border); border-radius: 18px; padding: 22px; background: var(--card); box-shadow: 0 10px 25px #1c41601a; }
        .top-nodes, .project-nodes { position: relative; z-index: 1; width: 100%; display: grid; gap: 18px; }
        .top-nodes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .project-nodes { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
        .center { z-index: 1; width: min(100%, 340px); padding: 34px 24px; text-align: center; color: var(--ink); }
        .center .label { font-size: .8rem; letter-spacing: .08em; color: var(--blue); font-weight: 800; }
        .center h2 { margin: 8px 0; font-size: 1.8rem; }
        .center p { margin: 0; font-weight: 600; }
        .skills, .role, .strength { min-height: 148px; }
        .node h3 { margin: 0 0 13px; font-size: 1rem; color: var(--navy); }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { border: 1px solid var(--node-border); border-radius: 20px; padding: 6px 10px; background: var(--subcard); font-size: .88rem; font-weight: 650; }
        .node p { white-space: pre-wrap; margin: 0; line-height: 1.65; font-size: .94rem; }
        .project-node { min-height: 150px; }
        .project-node h4 { margin: 0 0 9px; color: var(--blue); font-size: 1rem; }
        .project-image { width: 100%; max-height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; display: block; }
        .empty { grid-column: 1 / -1; align-self: center; text-align: center; padding: 70px 25px; background: var(--card); border: 1px solid var(--node-border); border-radius: 20px; color: var(--muted); box-shadow: 0 10px 25px #1c416010; }
        .hidden { display: none; }
        /* PDF 등 참고 자료로 이동하는 링크 영역 */
        .document-link { margin-top: 34px; text-align: center; }
        .document-link a { display: inline-block; padding: 12px 18px; border: 1px solid var(--blue); border-radius: 9px; color: var(--blue); background: var(--card); font-weight: 750; text-decoration: none; }
        .document-link a:hover { background: #e9f3fd; }
        @media (max-width: 750px) { .mindmap { min-height: 0; padding: 10px 0; gap: 16px; } .top-nodes, .project-nodes { grid-template-columns: 1fr; } .connections { display: none; } .node { width: 100%; } .center { order: -1; } }
    </style>
</head>
<body>
    <!-- 메인 이동만 제공하는 공개 헤더입니다. 로그인 메뉴가 없습니다. -->
    <header>
        <a class="brand" href="/">
            <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
                <line x1="16" y1="16" x2="6" y2="7" stroke="#B7D8F6" stroke-width="2.4"/>
                <line x1="16" y1="16" x2="26" y2="7" stroke="#B7D8F6" stroke-width="2.4"/>
                <line x1="16" y1="16" x2="6" y2="25" stroke="#B7D8F6" stroke-width="2.4"/>
                <line x1="16" y1="16" x2="26" y2="25" stroke="#B7D8F6" stroke-width="2.4"/>
                <circle cx="6" cy="7" r="3.4" fill="#83B7E5"/>
                <circle cx="26" cy="7" r="3.4" fill="#83B7E5"/>
                <circle cx="6" cy="25" r="3.4" fill="#83B7E5"/>
                <circle cx="26" cy="25" r="3.4" fill="#83B7E5"/>
                <circle cx="16" cy="16" r="5.4" fill="#3182CE"/>
            </svg>
            <span>포트폴리오 맵</span>
        </a>
        <button class="home-btn" type="button" onclick="location.href='/'">홈으로</button>
    </header>
    <main>
        <!-- 로그인 없이 누구나 볼 수 있는 개발자 소개 마인드맵 영역입니다. -->
        <div class="heading">
            <span class="eyebrow">DEVELOPER</span>
            <h1>이 서비스를 만든 개발자 소개</h1>
            <p>로그인 없이 누구나 볼 수 있는 개발자의 포트폴리오 마인드맵입니다.</p>
        </div>
        <section id="mindmap" class="mindmap hidden">
            <svg id="connections" class="connections" aria-hidden="true"></svg>
            <div class="top-nodes">
                <article class="node skills"><h3>✦ 보유 기술</h3><div id="skills" class="tags"></div></article>
                <article class="node role"><h3>✦ 역할</h3><p id="role"></p></article>
                <article class="node strength"><h3>✦ 강점</h3><p id="strength"></p></article>
            </div>
            <article class="node center"><div class="label">PORTFOLIO</div><h2 id="name"></h2><p id="center-role"></p></article>
            <div id="projects" class="project-nodes"></div>
        </section>
        <section id="empty" class="empty hidden">
            <h2>아직 공개된 소개 내용이 없습니다.</h2>
            <p>개발자 계정에서 포트폴리오를 작성하고 저장하면 이 화면에 표시됩니다.</p>
        </section>
        <!-- 요청에 따라 진로활동 PDF 링크를 개발자 소개 화면에 첨부합니다. -->
        <div class="document-link">
            <a href="https://drive.google.com/file/d/125tQAG2_cHx5fKIMxwbGADB2ejBnp3mY/view?usp=sharing" target="_blank" rel="noopener noreferrer">진로활동 PDF 보기 ↗</a>
        </div>
    </main>
    <script>
        // 로그인 여부와 무관하게 항상 지정된 개발자 계정의 포트폴리오만 공개로 불러옵니다.
        const API_URL = window.location.origin;

        function showEmpty() { document.getElementById('empty').classList.remove('hidden'); }

        function drawConnections() {
            const map = document.getElementById('mindmap');
            const center = map.querySelector('.center');
            const svg = document.getElementById('connections');
            if (!center || !svg || window.innerWidth <= 750) return;

            const mapRect = map.getBoundingClientRect();
            const centerRect = center.getBoundingClientRect();
            svg.setAttribute('viewBox', `0 0 ${mapRect.width} ${mapRect.height}`);
            svg.replaceChildren();

            map.querySelectorAll('.top-nodes .node, .project-nodes .node').forEach(node => {
                const rect = node.getBoundingClientRect();
                const isAbove = rect.top < centerRect.top;
                const x1 = centerRect.left - mapRect.left + centerRect.width / 2;
                const y1 = isAbove ? centerRect.top - mapRect.top : centerRect.bottom - mapRect.top;
                const x2 = rect.left - mapRect.left + rect.width / 2;
                const y2 = isAbove ? rect.bottom - mapRect.top : rect.top - mapRect.top;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                svg.appendChild(line);
            });
        }

        async function loadDevMindMap() {
            // 로그인 여부와 관계없이 /api/portfolio/dev 를 호출해 개발자 계정 데이터만 표시합니다.
            try {
                const response = await fetch(`${API_URL}/api/portfolio/dev`);
                if (response.status === 404) { showEmpty(); return; }
                if (!response.ok) throw new Error('portfolio request failed');
                const portfolio = await response.json();
                document.getElementById('name').textContent = portfolio.name || '이름 미입력';
                const role = portfolio.role || portfolio.position || '역할 미입력';
                document.getElementById('center-role').textContent = role;
                document.getElementById('role').textContent = role;
                document.getElementById('strength').textContent = portfolio.strength || '강점을 입력해 나만의 차별점을 보여주세요.';
                const projects = document.getElementById('projects');
                const projectList = portfolio.projects || (portfolio.details ? [{ title: '경력 및 프로젝트', description: portfolio.details }] : []);
                if (projectList.length) {
                    projectList.forEach(project => {
                        const item = document.createElement('article');
                        item.className = 'node project-node';
                        const title = document.createElement('h4');
                        title.textContent = project.title || '제목 없는 프로젝트';
                        const description = document.createElement('p');
                        description.textContent = project.description || '내용이 입력되지 않았습니다.';
                        if (project.image) {
                            const img = document.createElement('img');
                            img.className = 'project-image';
                            img.src = project.image;
                            img.alt = project.title || '프로젝트 이미지';
                            item.append(title, img, description);
                        } else {
                            item.append(title, description);
                        }
                        projects.appendChild(item);
                    });
                } else {
                    projects.innerHTML = '<article class="node project-node"><h4>프로젝트 미입력</h4><p>아직 등록된 프로젝트가 없습니다.</p></article>';
                }
                const skills = document.getElementById('skills');
                (portfolio.tech_stack || []).filter(Boolean).forEach(skill => { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = skill; skills.appendChild(tag); });
                if (!skills.children.length) skills.innerHTML = '<span class="tag">기술 미입력</span>';
                document.getElementById('mindmap').classList.remove('hidden');
                requestAnimationFrame(drawConnections);
            } catch (error) { showEmpty(); }
        }
        window.addEventListener('resize', drawConnections);
        loadDevMindMap();
    </script>
</body>
</html>
